role: hypothesizer
prompt_ref: prompts/hypothesizer.md
# 只能调这些 MCP 工具（其余一律无权）
mcp_tools:
  - get_a_news                 # 新闻
  - get_a_reports              # 研报
  - get_a_industry_reports
  - get_a_announcements        # 公告
  - get_a_lockup_expiry        # 解禁（被迫卖出）
  - get_a_holder_num
  - get_a_daily_dragon_tiger
  - event_study                # 因果 mcp：量 CAR
  - dml_cate                   # 哪类票对事件反应更强
